name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Hoặc nhánh bạn muốn trigger deploy (ví dụ: main)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Checkout mã nguồn repository

      - name: Set up Node.js 22.9.0
        uses: actions/setup-node@v3
        with:
          node-version: '22.9.0'  # Cấu hình Node.js phiên bản 22.9.0

      - name: Install dependencies
        run: npm install  # Cài đặt các dependencies của dự án

      - name: Build project
        run: npm run build  # Build dự án (tạo thư mục `dist` chứa các file cần deploy)

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy-github  # Chỉ định nhánh deploy-github để chứa các file đã build
          folder: dist  # Thư mục chứa các file build (ví dụ `dist` đối với Vue.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Sử dụng GitHub token để thực hiện deploy
