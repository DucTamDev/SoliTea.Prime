name: Soli App Deployment to GitHub Pages

on:
  push:
    branches:
      - deploy-github  # Trigger on push to the deploy-github branch
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository manually using HTTPS
    - name: Checkout repository
      run: git clone https://github.com/${{ github.repository }} .

    # Step 2: Set up Node.js manually
    - name: Set up Node.js
      run: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm install

    # Step 4: Build the Vue app
    - name: Build the app
      run: npm run build

    # Step 5: Archive build output
    - name: Archive build artifact
      run: |
        tar -czf artifact.tar.gz -C dist .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    # Step 6: Download and extract artifact
    - name: Download and extract artifact
      run: |
        tar -xzf artifact.tar.gz -C /var/www/html/

    # Step 7: Configure GitHub Pages
    - name: Configure GitHub Pages
      run: |
        mkdir -p /var/www/html/.github/pages
        echo "Deployment successful" > /var/www/html/.github/pages/index.html
