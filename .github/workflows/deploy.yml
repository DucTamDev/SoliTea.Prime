name: Soli App Deployment to GitHub Pages

on:
    push:
        branches:
            - deploy-github # Trigger on push to the deploy-github branch
    workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
    contents: write # Permissions for writing to the repository

jobs:
    checkout:
        runs-on: ubuntu-latest
        steps:
            # Stage 1: Checkout the repository
            - name: Checkout repository
              run: |
                  mkdir repo-checkout
                  cd repo-checkout
                  git clone https://github.com/${{ github.repository }} .
                  git checkout deploy-github  # Ensure we're on the correct branch
                  echo "Current directory: $(pwd)"
                  ls -la  # Debug contents
            # Persist the cloned repo for the next job, excluding .git
            - name: Upload repository artifact
              run: |
                  cd repo-checkout
                  # Archive everything except .git to avoid changes during tar
                  tar -czf repo.tar.gz --exclude=.git .
                  mv repo.tar.gz /tmp/repo.tar.gz
                  ls -la /tmp  # Verify artifact exists

    build:
        runs-on: ubuntu-latest
        needs: checkout # Depends on checkout job
        steps:
            # Stage 2: Download the checked-out repo and build
            - name: Download repository artifact
              run: |
                  mkdir repo-build
                  cd repo-build
                  mv /tmp/repo.tar.gz .
                  tar -xzf repo.tar.gz
                  rm repo.tar.gz
                  echo "Current directory: $(pwd)"
                  ls -la

            - name: Set up Node.js
              run: |
                  curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
                  sudo apt-get install -y nodejs
                  node --version  # Should be 22.x
                  npm --version   # Verify npm

            - name: Install dependencies
              run: |
                  cd repo-build
                  npm install || exit 1

            - name: Build the app
              run: |
                  cd repo-build
                  npm run build
                  ls -la dist/ || echo "dist/ directory not found"  # Verify build output

            # Persist the build output for the deploy job
            - name: Upload build artifact
              run: |
                  cd repo-build
                  tar -czf dist.tar.gz dist
                  mv dist.tar.gz /tmp/dist.tar.gz
                  ls -la /tmp  # Verify artifact exists

    deploy:
        runs-on: ubuntu-latest
        needs: build # Depends on build job
        steps:
            # Stage 3: Deploy to gh-pages branch
            - name: Download build artifact
              run: |
                  mkdir deploy
                  cd deploy
                  mv /tmp/dist.tar.gz .
                  tar -xzf dist.tar.gz
                  rm dist.tar.gz
                  echo "Current directory: $(pwd)"
                  ls -la dist/

            - name: Clone repo for deployment
              run: |
                  cd deploy
                  git clone https://github.com/${{ github.repository }} .
                  git fetch

            - name: Deploy to gh-pages branch
              run: |
                  cd deploy
                  # Configure git
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"

                  # Switch to gh-pages branch (create if it doesn't exist)
                  if git show-ref --quiet refs/heads/gh-pages; then
                    git checkout gh-pages
                  else
                    git checkout --orphan gh-pages
                    git rm -rf .  # Clear the branch if newly created
                  fi

                  # Debug current state
                  echo "Current directory: $(pwd)"
                  ls -la

                  # Move build output to root and clean up
                  rm -rf ./*  # Remove existing files in gh-pages
                  mv dist/* . || { echo "Failed to move dist/*"; exit 1; }
                  rm -rf dist  # Remove the now-empty dist folder

                  # Verify files are in place
                  ls -la

                  # Commit and push to gh-pages
                  git add .
                  git commit -m "Deploy to GitHub Pages from deploy-github branch" || echo "Nothing to commit"
                  git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
                  git push origin gh-pages --force
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
