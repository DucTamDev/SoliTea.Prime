name: Soli App Deployment to GitHub Pages

on:
  push:
    branches:
      - deploy-github  # Trigger on push to the deploy-github branch
  workflow_dispatch:  # Allow manual trigger from the Actions tab

# Permissions for writing to the repository
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository manually using HTTPS
      - name: Checkout repository
        run: git clone https://github.com/${{ github.repository }} .

      # Step 2: Set up Node.js manually with sudo
      - name: Set up Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
          sudo apt-get install -y nodejs
          node --version  # Verify Node.js version (22.9.0)

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the Vue app
      - name: Build the app
        run: npm run build

      # Step 5: Deploy to gh-pages branch
      - name: Deploy to gh-pages branch
        run: |
          # Configure git
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Check if gh-pages branch exists, create it if not
          git fetch
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          
          # Remove old files and copy new build output
          rm -rf ./*
          cp -r dist/* .
          
          # Commit and push to gh-pages
          git add .
          git commit -m "Deploy to GitHub Pages from deploy-github branch"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}